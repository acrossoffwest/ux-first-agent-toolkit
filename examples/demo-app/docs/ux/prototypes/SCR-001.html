<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>SCR-001 — Projects list</title>
<style>
  * { font-family:system-ui,sans-serif; box-sizing:border-box; }
  body { margin:0; background:#f9fafb; color:#1a1a1a; }
  main { max-width:720px; margin:24px auto; padding:0 24px; }
  .wire { border:1px dashed #d1d5db; border-radius:8px; padding:16px; background:#fff; margin-bottom:12px; }
  button { padding:8px 16px; border:1px solid #2563eb; border-radius:6px; background:#2563eb; color:#fff; cursor:pointer; }
  [hidden] { display:none !important; }
  .state-bar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:8px 24px; background:#111; }
  .state-bar button { background:#333; border-color:#333; font-size:12px; }
</style></head>
<body data-screen="SCR-001" data-story="US-001">
<main>
  <h1>Проекты <button data-testid="new-project" onclick="location.href='SCR-002.html'">Новый проект</button></h1>
  <section data-state="empty" class="wire">
    <p>Пока нет ни одного проекта.</p>
    <p>Создайте первый — это займёт полминуты.</p>
    <button data-testid="empty-create" onclick="location.href='SCR-002.html'">Создать первый проект</button>
  </section>
  <section data-state="default" class="wire" hidden>
    <ul><li><a data-testid="open-project-0" href="SCR-003.html">Альфа</a> · 2 участника</li></ul>
  </section>
  <!-- loading/error states not applicable: static local data, no async source -->
</main>
<div class="state-bar">
  <button onclick="setState('empty')">empty</button>
  <button onclick="setState('default')">default</button>
</div>
<script>
function setState(n){document.querySelectorAll('[data-state]').forEach(e=>{e.hidden=e.dataset.state!==n;});}
</script>
</body></html>
